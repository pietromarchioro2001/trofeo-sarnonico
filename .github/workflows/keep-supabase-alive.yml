name: Keep Supabase Alive

on:
  schedule:
    # Ogni 5 giorni alle 9:00 UTC
    - cron: '0 9 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s "https://hzcgblmzfiubicxmpaie.supabase.co/rest/v1/teams?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"